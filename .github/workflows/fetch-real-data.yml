name: FINSABER quality-dip research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-real-data.yml'
      - 'scripts/download_finsaber_prices.py'
      - 'scripts/download_sec_facts_mirror.py'
      - 'scripts/download_sp500_membership.py'
      - 'scripts/build_fundamentals.py'
      - 'scripts/build_mirror_fundamentals.py'
      - 'scripts/build_research_panel.py'
      - 'scripts/build_sec_fundamentals.py'
      - 'scripts/build_universe.py'
      - 'scripts/validate_research_data.py'
      - 'scripts/run_quality_dip_sweep.py'
      - 'scripts/run_outlier_sensitivity.py'
      - 'src/data/**'
      - 'src/research/**'
      - 'src/strategies/quality_bad_news.py'
      - 'src/backtest/**'
      - 'tests/**'
      - 'requirements.txt'
  workflow_dispatch:

concurrency:
  group: finsaber-quality-dip-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finsaber-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: ${{ github.workspace }}
      HF_HOME: ${{ github.workspace }}/.hf-cache
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Cache FINSABER source partitions
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: finsaber-v2-prices-${{ runner.os }}-v1
      - name: Cache SEC Company Facts mirror shards
        uses: actions/cache@v4
        with:
          path: .sec-mirror-cache
          key: sec-company-facts-parquet-latest-${{ runner.os }}-v1
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Download and pin FINSABER-2 prices
        run: |
          python scripts/download_finsaber_prices.py \
            --start-year 2000 \
            --end-year 2025 \
            --output data/real/finsaber_prices.parquet \
            --manifest data/real/finsaber_price_manifest.json \
            --min-rows 4500000 \
            --min-tickers 750 \
            --max-invalid-ohlc-rows 1000
      - name: Download and pin historical S&P membership
        run: |
          python scripts/download_sp500_membership.py \
            --output-dir data/real/raw \
            --manifest data/real/sp500_membership_manifest.json
      - name: Build historical universe intervals
        run: |
          python scripts/build_universe.py \
            --history data/real/raw/sp_500_historical_components.csv \
            --output data/real/universe_intervals.csv
      - name: Validate broad FINSABER market data
        run: |
          python scripts/validate_research_data.py \
            --prices data/real/finsaber_prices.parquet \
            --universe data/real/universe_intervals.csv \
            --report data/real/validation_finsaber_market.json \
            --min-total-price-rows 4500000 \
            --min-price-tickers 750 \
            --min-rows-per-ticker 2
      - name: Download point-in-time SEC Company Facts mirror
        run: |
          python scripts/download_sec_facts_mirror.py \
            --prices data/real/finsaber_prices.parquet \
            --output data/real/sec_mirror_facts.parquet \
            --manifest data/real/sec_facts_mirror_manifest.json \
            --cache-dir .sec-mirror-cache \
            --min-matched-ciks 600
      - name: Build point-in-time fundamentals from SEC mirror
        run: |
          python scripts/build_mirror_fundamentals.py \
            --prices data/real/finsaber_prices.parquet \
            --facts data/real/sec_mirror_facts.parquet \
            --output data/real/fundamentals.csv \
            --audit data/real/fundamentals_audit.csv \
            --source data/real/fundamentals_source.json \
            --mirror-manifest data/real/sec_facts_mirror_manifest.json
      - name: Build fundamental-covered research panel
        run: |
          python scripts/build_research_panel.py \
            --prices data/real/finsaber_prices.parquet \
            --fundamentals data/real/fundamentals.csv \
            --universe data/real/universe_intervals.csv \
            --output data/real/research_prices.parquet \
            --coverage data/real/research_coverage.json
      - name: Validate causal quality research panel
        run: |
          python scripts/validate_research_data.py \
            --prices data/real/research_prices.parquet \
            --fundamentals data/real/fundamentals.csv \
            --universe data/real/universe_intervals.csv \
            --report data/real/validation_full.json
      - name: Run 384 quality-dip robustness variants
        run: |
          python scripts/run_quality_dip_sweep.py \
            --prices data/real/research_prices.parquet \
            --fundamentals data/real/fundamentals.csv \
            --universe data/real/universe_intervals.csv \
            --source-manifest data/real/finsaber_price_manifest.json \
            --coverage data/real/research_coverage.json \
            --output results/quality_dip_real \
            --initial-capital 10000 \
            --max-positions 10 \
            --max-position-fraction 0.10 \
            --train-end 2020-10-12 \
            --validation-end 2023-05-19
      - name: Stress test extreme adjusted-price moves
        run: |
          python scripts/run_outlier_sensitivity.py \
            --prices data/real/research_prices.parquet \
            --trades results/quality_dip_real/top_variant_trades.csv \
            --leaderboard results/quality_dip_real/leaderboard.csv \
            --output results/quality_dip_real \
            --oos-start 2023-05-20 \
            --threshold 3.0 \
            --initial-capital 10000 \
            --max-positions 10 \
            --max-position-fraction 0.10
      - name: Keep reproducible membership sources
        run: |
          cp data/real/raw/sp_500_historical_components.csv data/real/sp500_historical_components.csv
          cp data/real/raw/sp500_constituents.csv data/real/sp500_current_constituents.csv
      - name: Commit compact provenance and research outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/real/finsaber_price_manifest.json \
            data/real/sec_facts_mirror_manifest.json \
            data/real/sp500_membership_manifest.json \
            data/real/fundamentals.csv \
            data/real/fundamentals_audit.csv \
            data/real/fundamentals_source.json \
            data/real/research_coverage.json \
            data/real/universe_intervals.csv \
            data/real/validation_finsaber_market.json \
            data/real/validation_full.json \
            data/real/sp500_historical_components.csv \
            data/real/sp500_current_constituents.csv
          git add -f \
            results/quality_dip_real/parameter_sweep.csv \
            results/quality_dip_real/leaderboard.csv \
            results/quality_dip_real/experiment_manifest.json \
            results/quality_dip_real/robustness_report.md \
            results/quality_dip_real/heatmap_validation_return.csv \
            results/quality_dip_real/heatmap_validation_portfolio_sharpe.csv \
            results/quality_dip_real/heatmap_oos_return.csv \
            results/quality_dip_real/heatmap_oos_portfolio_sharpe.csv \
            results/quality_dip_real/price_outliers.csv \
            results/quality_dip_real/outlier_sensitivity.csv \
            results/quality_dip_real/outlier_sensitivity.md
          if [ -f results/quality_dip_real/top_variant_trades.csv ]; then
            git add -f results/quality_dip_real/top_variant_trades.csv
          fi
          if git diff --cached --quiet; then
            echo 'No derived changes.'
          else
            git commit -m 'data: refresh FINSABER robustness research'
            git pull --rebase origin main
            git push
          fi
