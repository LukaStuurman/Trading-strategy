name: Fetch real historical data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-real-data.yml'
      - 'scripts/download_real_data.py'
      - 'scripts/build_sec_fundamentals.py'
      - 'scripts/build_universe.py'
      - 'scripts/validate_research_data.py'
      - 'scripts/run_quality_dip_sweep.py'
      - 'src/data/**'
      - 'src/research/**'
      - 'src/strategies/quality_bad_news.py'
      - 'src/backtest/**'
      - 'tests/**'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-backtest:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Download prices, S&P history and SEC Company Facts
        env:
          SEC_USER_AGENT: Trading-strategy 32568576+LukaStuurman@users.noreply.github.com
        run: |
          python scripts/download_real_data.py \
            --tickers AAPL,MSFT,GOOGL,AMZN,META,NVDA,JPM,COST,HD,NKE \
            --start 2000-01-01

      - name: Build historical universe intervals
        run: |
          python scripts/build_universe.py \
            --history data/real/raw/sp500_historical_components.csv \
            --output data/real/universe_intervals.csv

      - name: Validate market data before research
        run: |
          python scripts/validate_research_data.py \
            --prices data/real/prices.csv \
            --universe data/real/universe_intervals.csv \
            --report data/real/validation_market.json

      - name: Build point-in-time SEC fundamentals
        run: |
          python scripts/build_sec_fundamentals.py \
            --prices data/real/prices.csv \
            --output data/real/fundamentals.csv \
            --audit data/real/fundamentals_audit.csv

      - name: Validate full point-in-time research dataset
        run: |
          python scripts/validate_research_data.py \
            --prices data/real/prices.csv \
            --fundamentals data/real/fundamentals.csv \
            --universe data/real/universe_intervals.csv \
            --report data/real/validation_full.json

      - name: Run 384 quality-dip robustness variants
        run: |
          python scripts/run_quality_dip_sweep.py \
            --prices data/real/prices.csv \
            --fundamentals data/real/fundamentals.csv \
            --universe data/real/universe_intervals.csv \
            --output results/quality_dip_real \
            --initial-capital 10000 \
            --max-positions 10 \
            --max-position-fraction 0.10

      - name: Keep reproducible membership sources
        run: |
          cp data/real/raw/sp500_historical_components.csv data/real/sp500_historical_components.csv
          cp data/real/raw/sp500_current_constituents.csv data/real/sp500_current_constituents.csv

      - name: Commit derived real data and research results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/real/prices.csv \
            data/real/price_sources.json \
            data/real/fundamentals.csv \
            data/real/fundamentals_audit.csv \
            data/real/universe_intervals.csv \
            data/real/validation_market.json \
            data/real/validation_full.json \
            data/real/sp500_historical_components.csv \
            data/real/sp500_current_constituents.csv \
            data/real/download_manifest.json
          git add -f \
            results/quality_dip_real/parameter_sweep.csv \
            results/quality_dip_real/leaderboard.csv \
            results/quality_dip_real/experiment_manifest.json \
            results/quality_dip_real/robustness_report.md \
            results/quality_dip_real/heatmap_oos_return.csv \
            results/quality_dip_real/heatmap_oos_portfolio_sharpe.csv
          if [ -f results/quality_dip_real/top_variant_trades.csv ]; then
            git add -f results/quality_dip_real/top_variant_trades.csv
          fi
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m 'data: refresh validated robustness research'
            git pull --rebase origin main
            git push
          fi
