name: Fetch real historical data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-real-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download real historical data
        env:
          SEC_USER_AGENT: Trading-strategy GitHub research bot contact via repository owner
        run: |
          python scripts/download_real_data.py \
            --tickers AAPL,MSFT,GOOGL,AMZN,META,NVDA,JPM,COST,HD,NKE \
            --start 2000-01-01 \
            --skip-sec

      - name: Keep reproducible backtest files
        run: |
          mkdir -p data/real
          cp data/real/raw/sp500_historical_components.csv data/real/sp500_historical_components.csv
          cp data/real/raw/sp500_current_constituents.csv data/real/sp500_current_constituents.csv

      - name: Commit downloaded data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/real/prices.csv data/real/sp500_historical_components.csv data/real/sp500_current_constituents.csv data/real/download_manifest.json
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m 'data: fetch real historical prices and S&P 500 membership'
            git push
          fi
