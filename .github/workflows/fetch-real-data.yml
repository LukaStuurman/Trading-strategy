name: Fetch real historical data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-real-data.yml'
      - 'scripts/download_real_data.py'
      - 'scripts/build_sec_fundamentals.py'
      - 'scripts/run_quality_dip_sweep.py'
      - 'src/strategies/quality_bad_news.py'
      - 'src/backtest/metrics.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Download prices, S&P history and SEC Company Facts
        env:
          SEC_USER_AGENT: Trading-strategy GitHub research bot contact via repository owner
        run: |
          python scripts/download_real_data.py \
            --tickers AAPL,MSFT,GOOGL,AMZN,META,NVDA,JPM,COST,HD,NKE \
            --start 2000-01-01

      - name: Build point-in-time SEC fundamentals
        run: |
          python scripts/build_sec_fundamentals.py \
            --prices data/real/prices.csv \
            --output data/real/fundamentals.csv \
            --audit data/real/fundamentals_audit.csv

      - name: Run all 48 quality-dip variants
        run: |
          python scripts/run_quality_dip_sweep.py \
            --prices data/real/prices.csv \
            --fundamentals data/real/fundamentals.csv \
            --output results/quality_dip_real

      - name: Keep reproducible backtest files
        run: |
          mkdir -p data/real
          cp data/real/raw/sp500_historical_components.csv data/real/sp500_historical_components.csv
          cp data/real/raw/sp500_current_constituents.csv data/real/sp500_current_constituents.csv

      - name: Commit derived real data and results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/real/prices.csv \
            data/real/fundamentals.csv \
            data/real/fundamentals_audit.csv \
            data/real/sp500_historical_components.csv \
            data/real/sp500_current_constituents.csv \
            data/real/download_manifest.json \
            results/quality_dip_real/parameter_sweep.csv \
            results/quality_dip_real/all_trades.csv || true
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m 'data: refresh real fundamentals and quality-dip backtests'
            git push
          fi
